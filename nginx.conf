server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # /gizlilik ve /gizlilik.html ikisi de çalışsın
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Meta'nın inceleme botu sayfayı okuyabilmeli
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
